name: Build The King APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Show versions
        run: |
          node -v
          npm -v
          java -version

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/ || true
          cp sw.js www/ || true
          cp icon.svg www/ || true

      - name: Initialize Capacitor
        run: |
          npx cap init "The King - إدارة المطبعة" "com.theking.print" --web-dir www

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheKing-v5.1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
